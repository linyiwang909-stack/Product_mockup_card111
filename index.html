<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#eef3f9">
<title>模卡中心</title>
<style>
  :root{
    --bg-1:#eef3f9;
    --bg-2:#e3ecf5;
    --text:#1b2a3a;
    --muted:rgba(27,42,58,.52);
    --line:rgba(27,42,58,.10);
  }

  *,*::before,*::after{box-sizing:border-box;}

  html{-webkit-text-size-adjust:100%;}

  body{
    margin:0;
    min-height:100vh;
    display:grid;
    padding:clamp(32px,6vw,80px) clamp(20px,4vw,32px);
    background:linear-gradient(160deg,var(--bg-1) 0%,var(--bg-2) 60%,#dbe7f2 100%);
    color:var(--text);
    font-family:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  /* ---------- 背景柔光 ---------- */
  .bg{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:0;
  }
  .orb{
    position:absolute;
    border-radius:50%;
    filter:blur(100px);
    opacity:.5;
    will-change:transform;
  }
  .orb-1{width:min(560px,72vw);aspect-ratio:1;background:#a8d8ea;top:-20%;left:-12%;animation:float1 26s ease-in-out infinite;}
  .orb-2{width:min(520px,68vw);aspect-ratio:1;background:#ffd9a8;bottom:-26%;right:-14%;animation:float2 30s ease-in-out infinite;}
  .orb-3{width:min(460px,60vw);aspect-ratio:1;background:#b8e6c1;top:38%;left:58%;animation:float3 34s ease-in-out infinite;}

  @keyframes float1{
    0%,100%{transform:translate(0,0) scale(1);}
    50%{transform:translate(64px,44px) scale(1.08);}
  }
  @keyframes float2{
    0%,100%{transform:translate(0,0) scale(1);}
    50%{transform:translate(-72px,-52px) scale(1.12);}
  }
  @keyframes float3{
    0%,100%{transform:translate(0,0) scale(1);}
    50%{transform:translate(-54px,62px) scale(.94);}
  }

  /* ---------- 布局 ---------- */
  .stage{
    position:relative;
    z-index:2;
    margin:auto;
    width:100%;
    max-width:1120px;
  }

  .head{margin-bottom:clamp(40px,6vw,64px);text-align:center;}

  .eyebrow{
    margin:0 0 18px;
    font-size:11px;
    font-weight:600;
    letter-spacing:.38em;
    text-transform:uppercase;
    color:rgba(27,42,58,.35);
  }

  h1{
    margin:0 0 16px;
    font-size:clamp(30px,5vw,46px);
    font-weight:700;
    letter-spacing:.14em;
    text-indent:.14em;
    background:linear-gradient(180deg,#16324a 0%,#4a7fa5 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .sub{
    margin:0;
    font-size:14px;
    letter-spacing:.12em;
    color:var(--muted);
  }

  /* ---------- 卡片 ---------- */
  .cards{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:24px;
  }

  .card{
    position:relative;
    display:flex;
    flex-direction:column;
    min-height:286px;
    padding:32px 28px 26px;
    border-radius:22px;
    text-decoration:none;
    color:inherit;
    isolation:isolate;
    overflow:hidden;
    background:linear-gradient(165deg,rgba(255,255,255,.92),rgba(255,255,255,.68));
    border:1px solid rgba(255,255,255,.9);
    box-shadow:
      0 2px 4px rgba(27,42,58,.04),
      0 12px 28px -12px rgba(27,42,58,.16),
      0 28px 56px -30px rgba(27,42,58,.28);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    transition:
      transform .5s cubic-bezier(.22,1,.36,1),
      border-color .5s ease,
      box-shadow .5s ease;
    will-change:transform;
    animation:rise .85s cubic-bezier(.22,1,.36,1) backwards;
  }
  .card:nth-child(1){animation-delay:.08s;}
  .card:nth-child(2){animation-delay:.16s;}
  .card:nth-child(3){animation-delay:.24s;}

  @keyframes rise{
    from{opacity:0;transform:translateY(26px);}
    to{opacity:1;transform:translateY(0);}
  }

  /* 鼠标跟随光斑 */
  .card::before{
    content:"";
    position:absolute;
    inset:0;
    z-index:0;
    opacity:0;
    background:radial-gradient(
      340px circle at var(--mx,50%) var(--my,0%),
      rgba(var(--rgb),.16),
      transparent 62%
    );
    transition:opacity .5s ease;
  }

  /* 顶部强调光线 */
  .card::after{
    content:"";
    position:absolute;
    top:0;
    left:24px;
    right:24px;
    height:2px;
    z-index:2;
    opacity:0;
    border-radius:2px;
    background:linear-gradient(90deg,transparent,rgb(var(--rgb)),transparent);
    transition:opacity .5s ease;
  }

  .card:hover{
    transform:translateY(-8px);
    border-color:rgba(var(--rgb),.4);
    box-shadow:
      0 4px 8px rgba(27,42,58,.05),
      0 20px 40px -14px rgba(var(--rgb),.35),
      0 36px 68px -30px rgba(27,42,58,.32);
  }
  .card:hover::before{opacity:1;}
  .card:hover::after{opacity:1;}

  .card:focus-visible{
    outline:2px solid rgb(var(--rgb));
    outline-offset:4px;
  }

  .card > *{position:relative;z-index:1;}

  /* 序号 */
  .num{
    position:absolute;
    top:28px;
    right:28px;
    z-index:1;
    font-size:12px;
    font-weight:600;
    letter-spacing:.14em;
    font-variant-numeric:tabular-nums;
    color:rgba(27,42,58,.18);
    transition:color .5s ease;
  }
  .card:hover .num{color:rgba(var(--rgb),.85);}

  /* 图标 */
  .icon{
    width:56px;
    height:56px;
    display:grid;
    place-items:center;
    margin-bottom:30px;
    border-radius:17px;
    color:rgb(var(--rgb));
    background:rgba(var(--rgb),.13);
    border:1px solid rgba(var(--rgb),.22);
    transition:
      transform .5s cubic-bezier(.22,1,.36,1),
      background .5s ease,
      box-shadow .5s ease;
  }
  .icon svg{width:27px;height:27px;}
  .card:hover .icon{
    transform:translateY(-3px) scale(1.06);
    background:rgba(var(--rgb),.22);
    box-shadow:0 10px 22px -10px rgba(var(--rgb),.7);
  }

  /* 文字 */
  .name{
    margin:0 0 9px;
    font-size:19px;
    font-weight:600;
    letter-spacing:.05em;
    line-height:1.4;
    color:#16324a;
  }

  .en{
    margin:0 0 30px;
    font-size:11px;
    font-weight:600;
    letter-spacing:.2em;
    text-transform:uppercase;
    color:rgba(27,42,58,.38);
    transition:color .5s ease;
  }
  .card:hover .en{color:rgb(var(--rgb));}

  /* 底部引导 */
  .cta{
    margin-top:auto;
    padding-top:18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    border-top:1px solid rgba(27,42,58,.10);
    font-size:13px;
    font-weight:500;
    letter-spacing:.1em;
    color:rgba(27,42,58,.5);
    transition:color .5s ease,border-color .5s ease;
  }
  .card:hover .cta{
    color:rgb(var(--rgb));
    border-color:rgba(var(--rgb),.35);
  }
  .cta svg{
    flex:none;
    transition:transform .4s cubic-bezier(.22,1,.36,1);
  }
  .card:hover .cta svg{transform:translateX(5px);}

  /* 页脚 */
  .foot{
    margin:clamp(40px,6vw,64px) 0 0;
    text-align:center;
    font-size:12px;
    letter-spacing:.16em;
    color:rgba(27,42,58,.32);
  }

  /* ---------- 响应式 ---------- */
  @media (max-width:900px){
    .cards{
      grid-template-columns:1fr;
      max-width:460px;
      margin:0 auto;
      gap:18px;
    }
    .card{min-height:0;padding:28px 24px 24px;}
    .icon{margin-bottom:24px;}
    .en{margin-bottom:24px;}
  }

  @media (prefers-reduced-motion:reduce){
    *,
    *::before,
    *::after{
      animation-duration:.001ms !important;
      animation-iteration-count:1 !important;
      transition-duration:.001ms !important;
    }
  }
</style>
</head>
<body>

  <!-- 背景柔光 -->
  <div class="bg" aria-hidden="true">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
    <span class="orb orb-3"></span>
  </div>

  <main class="stage">

    <header class="head">
      <p class="eyebrow">Brand Card Center</p>
      <h1>模卡中心</h1>
      <p class="sub">请选择需要查看的板块</p>
    </header>

    <div class="cards">

      <!-- 01 仅三生物 -->
      <a class="card" href="GeneⅢ.html" style="--rgb:14,148,180">
        <span class="num">01</span>
        <span class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 3c0 5 8 5 8 9s-8 4-8 9"/>
            <path d="M16 3c0 5-8 5-8 9s8 4 8 9"/>
            <path d="M9.4 7.2h5.2M9.4 16.8h5.2M8 12h8"/>
          </svg>
        </span>
        <h2 class="name">仅三生物模卡</h2>
        <p class="en">Gene Ⅲ</p>
        <span class="cta">
          查看模卡
          <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor"
               stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 8h10M9 4l4 4-4 4"/>
          </svg>
        </span>
      </a>

      <!-- 02 地中海咖啡 -->
      <a class="card" href="Positive_Hotel_Coffee.html" style="--rgb:214,124,32">
        <span class="num">02</span>
        <span class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 9.5h12.5V14a4.5 4.5 0 0 1-4.5 4.5H8.5A4.5 4.5 0 0 1 4 14V9.5Z"/>
            <path d="M16.5 10.5h1.75a2.75 2.75 0 0 1 0 5.5H16.5"/>
            <path d="M8 3.6v2.2M11.5 3.6v2.2"/>
          </svg>
        </span>
        <h2 class="name">地中海咖啡模卡</h2>
        <p class="en">Positive Hotel Coffee</p>
        <span class="cta">
          查看模卡
          <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor"
               stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 8h10M9 4l4 4-4 4"/>
          </svg>
        </span>
      </a>

      <!-- 03 华岭仙精黄精茶 -->
      <a class="card" href="Polygonatum_Tea.html" style="--rgb:52,150,88">
        <span class="num">03</span>
        <span class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 20C4 11 11 4 20 4c0 9-7 16-16 16Z"/>
            <path d="M4 20 13.5 10.5"/>
          </svg>
        </span>
        <h2 class="name">华岭仙精黄精茶模卡</h2>
        <p class="en">Polygonatum Tea</p>
        <span class="cta">
          查看模卡
          <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor"
               stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 8h10M9 4l4 4-4 4"/>
          </svg>
        </span>
      </a>

    </div>

    <p class="foot">点击卡片进入对应模卡</p>

  </main>

  <script>
    // 鼠标跟随光斑
    document.querySelectorAll('.card').forEach(function (card) {
      card.addEventListener('pointermove', function (e) {
        var r = card.getBoundingClientRect();
        card.style.setProperty('--mx', (e.clientX - r.left) + 'px');
        card.style.setProperty('--my', (e.clientY - r.top) + 'px');
      });
      card.addEventListener('pointerleave', function () {
        card.style.removeProperty('--mx');
        card.style.removeProperty('--my');
      });
    });
  </script>

</body>
</html>
